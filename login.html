<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kurnool Eats - Login</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#ff6b00;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:400px;
  background:white;
  border-radius:25px;
  padding:30px 22px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  color:#ff6b00;
}

.tagline{
  text-align:center;
  color:#777;
  margin-top:7px;
  margin-bottom:30px;
}

h2{
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#ff6b00;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#ff6b00;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.switch{
  text-align:center;
  margin-top:18px;
  color:#777;
  font-size:14px;
}

.switch span{
  color:#ff6b00;
  font-weight:bold;
}

.error{
  color:red;
  font-size:13px;
  margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">
    🍴 Kurnool Eats
  </div>

  <div class="tagline">
    Your Food, Your City ❤️
  </div>


  <h2 id="title">
    Login
  </h2>


  <div id="error" class="error"></div>


  <input
    id="name"
    type="text"
    placeholder="Full Name"
    style="display:none"
  >


  <input
    id="phone"
    type="tel"
    placeholder="Mobile Number"
    maxlength="10"
  >


  <input
    id="password"
    type="password"
    placeholder="Password"
  >


  <button onclick="submitForm()">
    Login
  </button>


  <div class="switch">

    <span id="switchText">
      Don't have an account?
    </span>

    <br><br>

    <span onclick="switchMode()" id="switchButton">
      Create Account
    </span>

  </div>

</div>


<script>

let signupMode = false;


function switchMode(){

  signupMode = !signupMode;

  const name =
    document.getElementById("name");

  const title =
    document.getElementById("title");

  const button =
    document.querySelector("button");

  const switchText =
    document.getElementById("switchText");

  const switchButton =
    document.getElementById("switchButton");


  if(signupMode){

    title.innerText =
      "Create Account";

    name.style.display =
      "block";

    button.innerText =
      "Sign Up";

    switchText.innerText =
      "Already have an account?";

    switchButton.innerText =
      "Login";

  }else{

    title.innerText =
      "Login";

    name.style.display =
      "none";

    button.innerText =
      "Login";

    switchText.innerText =
      "Don't have an account?";

    switchButton.innerText =
      "Create Account";

  }

}


function submitForm(){

  const name =
    document.getElementById("name").value;

  const phone =
    document.getElementById("phone").value;

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");


  error.innerText = "";


  if(signupMode && name.trim() === ""){

    error.innerText =
      "Please enter your name.";

    return;

  }


  if(phone.length !== 10){

    error.innerText =
      "Enter a valid 10-digit mobile number.";

    return;

  }


  if(password.length < 6){

    error.innerText =
      "Password must contain at least 6 characters.";

    return;

  }


  if(signupMode){

    localStorage.setItem(
      "ke_user_name",
      name
    );

    localStorage.setItem(
      "ke_user_phone",
      phone
    );

    localStorage.setItem(
      "ke_user_password",
      password
    );

    alert(
      "Account created successfully! 🎉"
    );

  }else{

    const savedPhone =
      localStorage.getItem(
        "ke_user_phone"
      );

    const savedPassword =
      localStorage.getItem(
        "ke_user_password"
      );


    if(
      phone === savedPhone &&
      password === savedPassword
    ){

      localStorage.setItem(
        "ke_logged_in",
        "true"
      );

      window.location.href =
        "index.html";

    }else{

      error.innerText =
        "Mobile number or password is incorrect.";

    }

  }

}

</script>

</body>
</html>
