<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kurnool Eats - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ff6b00;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 22px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #ff6b00;
    }

    .tagline {
      text-align: center;
      color: #777;
      margin: 8px 0 28px;
    }

    h2 {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #777;
      font-size: 14px;
    }

    .switch span {
      color: #ff6b00;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-bottom: 12px;
      font-size: 14px;
    }
  </style>

</head>

<body>

  <div class="box">

    <div class="logo">
      🍴 Kurnool Eats
    </div>

    <div class="tagline">
      Your Food, Your City ❤️
    </div>

    <h2 id="title">Login</h2>

    <div id="message" class="message"></div>

    <input
      id="name"
      type="text"
      placeholder="Full Name"
      style="display:none;"
    >

    <input
      id="email"
      type="email"
      placeholder="Email Address"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="mainButton">
      Login
    </button>

    <div class="switch">

      <span id="switchText">
        Don't have an account?
      </span>

      <br><br>

      <span id="switchButton">
        Create Account
      </span>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyC20SnxmizEJOix4_OET2QfV3pbrdcWMGw",

      authDomain:
        "kurnool-eats-b67c1.firebaseapp.com",

      projectId:
        "kurnool-eats-b67c1",

      storageBucket:
        "kurnool-eats-b67c1.firebasestorage.app",

      messagingSenderId:
        "271822665719",

      appId:
        "1:271822665719:web:1f595de855c03e2a08e0f2",

      measurementId:
        "G-VPB16PPXSE"
    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    let signupMode = false;


    const title =
      document.getElementById("title");

    const nameInput =
      document.getElementById("name");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const button =
      document.getElementById("mainButton");

    const switchButton =
      document.getElementById("switchButton");

    const switchText =
      document.getElementById("switchText");

    const message =
      document.getElementById("message");


    switchButton.onclick = function () {

      signupMode = !signupMode;

      message.innerText = "";

      if (signupMode) {

        title.innerText =
          "Create Account";

        nameInput.style.display =
          "block";

        button.innerText =
          "Sign Up";

        switchText.innerText =
          "Already have an account?";

        switchButton.innerText =
          "Login";

      } else {

        title.innerText =
          "Login";

        nameInput.style.display =
          "none";

        button.innerText =
          "Login";

        switchText.innerText =
          "Don't have an account?";

        switchButton.innerText =
          "Create Account";
      }

    };


    button.onclick = async function () {

      const name =
        nameInput.value.trim();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      message.innerText = "";


      if (signupMode && name === "") {

        message.innerText =
          "Please enter your name.";

        return;
      }


      if (email === "") {

        message.innerText =
          "Please enter your email.";

        return;
      }


      if (password.length < 6) {

        message.innerText =
          "Password must be at least 6 characters.";

        return;
      }


      button.disabled = true;


      try {

        if (signupMode) {

          const result =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          await updateProfile(
            result.user,
            {
              displayName: name
            }
          );


          message.innerText =
            "Account created successfully! 🎉";


          setTimeout(function () {

            window.location.href =
              "index.html";

          }, 1000);


        } else {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          message.innerText =
            "Login successful! 🎉";


          setTimeout(function () {

            window.location.href =
              "index.html";

          }, 700);

        }


      } catch (error) {

        console.log(error);

        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          message.innerText =
            "This email is already registered.";

        } else if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message.innerText =
            "Email or password is incorrect.";

        } else if (
          error.code ===
          "auth/weak-password"
        ) {

          message.innerText =
            "Password is too weak.";

        } else {

          message.innerText =
            error.message;
        }

      }


      button.disabled = false;

    };

  </script>

</body>

</html>
